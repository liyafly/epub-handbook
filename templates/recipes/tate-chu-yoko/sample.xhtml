<h1>纵中横</h1>
<div class="tcy-vertical">
<p>公元<span class="tcy">19</span>年<span class="tcy">12</span>月<span class="tcy">25</span>日，第<span class="tcy">3</span>卷第<span class="tcy">47</span>回写成。</p>
<p>这一句没有纵中横：公元19年12月25日。两句对照，看数字是竖起成一格还是侧躺。</p>
