<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="zh-CN" lang="zh-CN">
<head><title>中文标点</title><link rel="stylesheet" href="recipe.css" type="text/css"/></head>
<body>
<h1>中文标点</h1>
<div class="cjk-punct">
<p>“行首的引号”会被挤掉半格空白，看起来和正文左边对齐。他说：“好吧，（就这样）。”连续的标点——比如“。”和“」”——之间也会收紧。</p>
<p>中文和English或数字2026之间，会自动加一点间距；源码里不写空格。</p>
<p>这一段很长，用来看行尾的句号、逗号能不能挂到版心外面，而不是被挤到下一行行首。读起来，每一行的右边应该更齐整。</p>
</div>
<p>这一段不在可选类里：“行首的引号”保持原样，中文和English之间也不加间距。</p>
</body></html>
