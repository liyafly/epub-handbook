<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="zh-CN" lang="zh-CN">
<head><title>轮廓环绕</title><link rel="stylesheet" href="recipe.css" type="text/css"/></head>
<body>
<h1>轮廓环绕</h1>
<figure class="wrap wrap-left outline-l"><img src="art.png" alt="左侧竖线与底边组成的合成 L 形"/></figure>
<p>清晨，小路沿着河岸延伸。行人慢慢走过桥头，树叶在风中发出细微的声响。正文在图片旁连续流动，不预先拆成几栏，也不把某一行固定在某个坐标。阅读器改变字号时，文字应当自然换行，仍能依次读出完整的意思。河对岸的窗户陆续打开，一只小船从桥下经过，水纹缓缓散开。</p>
<p>这段合成文字继续检验环绕后的恢复：图片结束以后，正文应回到整行宽度。若阅读器忽略轮廓，矩形边界也应给文字留下足够位置。窄屏与大字号需要分别检查，避免仅凭桌面普通字号判断所有情况。小路转向树林，故事也继续向前。</p>
<p class="wrap-end">图片后的普通正文。</p>
</body></html>
