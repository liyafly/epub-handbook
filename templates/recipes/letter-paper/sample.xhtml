<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="zh-CN">
<head>
  <title>无边框信纸</title>
  <link rel="stylesheet" type="text/css" href="recipe.css"/>
</head>
<body>
  <h1>无边框信纸</h1>
  <p>合成结构样本；未加载嵌入字体，不作为楷体显示证据。</p>
  <div class="letter-paper">
    <p class="letter-salutation"><span class="letter-rule">亲爱的妈妈：</span></p>
    <p><span class="letter-rule">您好！</span></p>
    <p><span class="letter-rule">最近工作还顺利吗？我在学校一切都好，请您放心。上周的考试我进步了不少，老师还表扬了我。</span></p>
    <p><span class="letter-rule">只是最近天气转凉，您在家要注意保暖，别太操劳。等放假了我就回家看您。</span></p>
    <div class="letter-gap"></div>
    <p class="letter-closing"><span class="letter-rule">祝您</span></p>
    <p class="letter-wish"><span class="letter-rule">身体健康，万事如意！</span></p>
    <div class="letter-gap"></div>
    <div class="letter-signoff">
      <p class="letter-signature"><span class="letter-rule">您的儿子：小明</span></p>
      <p class="letter-date"><span class="letter-rule">2026年11月9日</span></p>
    </div>
    <div class="letter-gap"></div>
  </div>
</body>
</html>
