    failed_page: 03c-poster-contain
    issue: "Kindle Previewer CLI 转换成功，Enhanced Typesetting 支持，Summary_Log 记录 0 errors / 0 quality issues。contain 背景和 img fallback 未破坏 KFX 转换。"
    action: "保留单图卷封的 background-size:contain 与 .poster-fallback；继续用 GUI 检查不同设备视口下的留白与单页显示。"
    workaround: "含边缘文字的单图卷封不要使用 cover 或 100% 100%；优先接受 contain 留白，背景不支持时回退到原始 img。"

  - reader: kindle_previewer
    case: 17-image-layout
