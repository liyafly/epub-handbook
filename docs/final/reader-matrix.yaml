    action: "保持 figure 主路径和内部 img 等比缩放；复测浮动阈值、实例宽度、非等宽并排、caption 及大字号回归。"
    workaround: "环绕失败时先检查正文长度、剩余列宽和字号；短段不能作为失败证据。"
