retest_priorities:
  # 控制"待复测"池子只进不出的风险；完成后同步更新 expectations 或 untested_cases。
  - rank: 1
    case: 00-cover-metadata
    readers: [kindle_previewer]
    focus: "用当前构建产物复测封面声明，确认旧 W14016 不再复现。"
  - rank: 2
    case: 09-kindle-risk
    readers: [kindle_previewer]
    focus: "用当前构建产物复测完整 demo 可打开性，若仍失败再按页面级 CSS / Ruby / footnote / A-lite 二分。"
  - rank: 3
    case: 16-math
    readers: [ibooks_macos, kindle_previewer, readest]
    focus: "复测语义数据表中的真实 rowspan 分组、固定布局长 MathML 和场景内候选相对字号；不得继承外部生产样本的 pass。"
  - rank: 4
    case: 17-image-layout
    readers: [kindle_previewer, readest]
    focus: "复测 figure.img-left/right 主路径、单图实例宽度、34%/60% 非等宽并排、短段反例与大字号回归；不得继承外部生产样本的 pass。"
  - rank: 5
    case: 07-font-family-order
    readers: [ibooks_ios, ibooks_macos, kindle_previewer, thorium]
    focus: "在临时授权素材工作区构建正文自由+局部字体、直接 body 锁定、原字体/子集字体和双版本对照；记录 U+201C/U+201D、U+3007/U+25CB 与 CSS 生成引号的码位、cmap、实际字形和用户字体切换表现。"

expectations:
  # status: pass | warn | fail | na
  - reader: kindle_previewer
    case: 00-cover-metadata
    status: warn
    reader_version: unknown
    artifact: templates/epub-style-demo/dist/epub-style-demo-20260520-233054.epub
    failed_page: package.opf
    issue: "Kindle Previewer W14016: 没有指定封面"
    action: "已在 demo OPF 中补充 PNG cover-image 与 meta name=cover；待重新导入 Kindle Previewer 复测。"
    workaround: "使用 raster 封面图，并同时声明 properties=\"cover-image\" 与 meta name=\"cover\"。"
  - reader: kindle_previewer
    case: 09-kindle-risk
    status: warn
    reader_version: unknown
    artifact: templates/epub-style-demo/dist/epub-style-demo-20260520-235448.epub
    conversion_log: templates/epub-style-demo/dist/epub-style-demo-20260520-233702-conversionLog.csv
    failed_page: unknown
    issue: "conversionLog 只有表头、没有错误行；用户端反馈转换后文档仍打不开。"
    action: "已新增 toc.ncx、spine toc、Kindle 风险页和场景矩阵；完整 demo 已改为 PNG 资源路径，待用新构建产物复测。"
    workaround: "若新包仍打不开，先用 templates/kindle-minimal-repro/dist/kindle-minimal-repro-20260520-235314.epub 对照；minimal 可打开而完整 demo 不可打开时，继续二分页面级 CSS / Ruby / footnote / A-lite 特性。"
  - reader: kindle_previewer
    case: 03c-poster-contain
    status: warn
    reader_version: "3.104.0"
    profile: "CLI conversion"
    artifact: templates/epub-style-demo/dist/epub-style-demo-20260601-090203.epub
