    workaround: "Grid/Flex 被忽略时接受线性降级；布局表仅用于已验证目标，不得回退到 mlabeledtr 作为跨阅读器公式编号主路径。目标平台完全不支持 MathML 时另备文本或图片公式 fallback。"
