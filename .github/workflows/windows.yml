name: Windows CLI

# 书级工作流（epub book ...）要求在 Windows 上无需 sh / python 即可从导入到出成品。
# 这里在 windows-latest 上编译并运行相关 Go 测试；它不是阅读器验收，也不替代
# 含 epub-font provider 的真实书构建（provider 另行安装）。

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: go build + book tests (windows-latest)
    runs-on: windows-latest
    steps:
      - name: 保持 LF 检出，避免模板与 fixture 被转成 CRLF
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: 书级工作流与磁盘边界测试
        run: >
          go test -count=1
          ./internal/zipfs/
          ./internal/extern/
          ./internal/archguard/
          ./internal/docguard/
        shell: bash

      - name: epub book 端到端（合成 fixture）
        run: go test -count=1 -run "TestBook|TestResolveBook" ./internal/pipeline/
        shell: bash

      - name: epub book new / build 冒烟（无 sh、无 python）
        run: |
          go build -o epub.exe ./cmd/epub
          ./epub.exe book new "smoke book"
          ./epub.exe book build "smoke book"
          ./epub.exe book accept-dist "smoke book"
          mkdir -p "smoke book/variants/kindle/OEBPS/Styles"
          printf 'p { text-indent: 2em; }\n' > "smoke book/variants/kindle/OEBPS/Styles/reader.css"
          printf '{"version":1,"title":"smoke","output":"book.epub","fonts":[],"variants":{"kindle":{"overlay":"variants/kindle","output":"book-kindle.epub"}}}\n' > "smoke book/book.json"
          ./epub.exe book preview "smoke book" --variant kindle
          ./epub.exe book build "smoke book"
          test -f "smoke book/out/book-kindle.epub"
        shell: bash

  readalong:
    # 有声同步的真实外部工具链：whisper.cpp 官方 Windows 包 + FFmpeg，单个 m4b →
    # transcribe → build。单元测试里的假 whisper / ffmpeg 是 shell 脚本，在 Windows 上跳过，
    # 这里补上 Windows 的真实调用路径。
    name: read-along smoke (real whisper.cpp + FFmpeg, windows-latest)
    runs-on: windows-latest
    env:
      WHISPER_BUILD: b5454 # 与 whisper.cpp v1.9.5 同日的发布构建（v1.9.x 本身不带二进制）
      PYTHON: python
    steps:
      - name: 保持 LF 检出
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 FFmpeg
        run: choco install ffmpeg -y --no-progress

      - name: 下载 whisper.cpp、base.en 模型和 jfk.wav
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/whisper"
          curl -fsSL -o "$RUNNER_TEMP/whisper.zip" "https://github.com/ggml-org/whisper.cpp/releases/download/$WHISPER_BUILD/whisper-bin-x64.zip"
          unzip -q "$RUNNER_TEMP/whisper.zip" -d "$RUNNER_TEMP/whisper" || 7z x -y -o"$RUNNER_TEMP/whisper" "$RUNNER_TEMP/whisper.zip"
          cygpath -w "$RUNNER_TEMP/whisper/Release" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/ggml-base.en.bin" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
          curl -fsSL -o "$RUNNER_TEMP/jfk.wav" https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.9.5/samples/jfk.wav

      - name: m4b → transcribe → build
        shell: bash
        run: |
          whisper-cli --version || true
          ffmpeg -version | head -1
          go build -o epub.exe ./cmd/epub
          bash .github/scripts/readalong-smoke.sh ./epub.exe "$RUNNER_TEMP/readalong" "$RUNNER_TEMP/ggml-base.en.bin" "$RUNNER_TEMP/jfk.wav"
