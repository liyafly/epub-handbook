name: Build EPUB Demo

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - '.markdownlint-cli2.jsonc'
      - '.python-version'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'uv.lock'
      - 'templates/epub-style-demo/**'
      - 'samples/demo-books/**'
      - 'scripts/**'
      - 'skills/**'
      - 'docs/final/**'
      - 'docs/README.md'
      - 'docs/getting-started/**'
      - 'docs/guides/**'
      - 'docs/pipeline/**'
      - '.github/workflows/build-epub-demo.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - '.markdownlint-cli2.jsonc'
      - '.python-version'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'uv.lock'
      - 'templates/epub-style-demo/**'
      - 'samples/demo-books/**'
      - 'scripts/**'
      - 'skills/**'
      - 'docs/final/**'
      - 'docs/README.md'
      - 'docs/getting-started/**'
      - 'docs/guides/**'
      - 'docs/pipeline/**'
      - '.github/workflows/build-epub-demo.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Clean dist
        run: rm -rf templates/epub-style-demo/dist

      - name: Build demo EPUB
        run: sh templates/epub-style-demo/build.sh

      - name: Lint Markdown
        run: |
          npm install -g markdownlint-cli2
          markdownlint-cli2 --config .markdownlint-cli2.jsonc \
            'README.md' 'CONTRIBUTING.md' 'CHANGELOG.md' 'AGENTS.md' 'CLAUDE.md' \
            'docs/README.md' \
            'docs/final/**/*.md' 'docs/getting-started/**/*.md' \
            'docs/guides/**/*.md' 'docs/pipeline/**/*.md' 'skills/**/*.md'

      - name: Validate local fixtures and skills
        run: |
          epub=$(ls templates/epub-style-demo/dist/*.epub | head -n 1)
          python3 scripts/validate_skills_basic.py
          python3 scripts/test_epub_ai_harness.py
          python3 scripts/test_validate_text_invariance.py
          python3 scripts/test_epub_cleanup_harnesses.py
          python3 scripts/test_epub_cleanup_pipeline.py
          python3 scripts/test_epub3_oneclick_converter.py
          python3 scripts/test_epub_css_cleanup.py
          python3 scripts/test_epub_structure_tool.py
          python3 scripts/test_epub_anthology_refinement.py
          python3 scripts/test_validate_popup_notes.py
          python3 scripts/test_build_demo_epubs.py
          python3 scripts/test_epub_xhtml_transforms.py
          python3 scripts/test_epub_text_gate.py
          python3 scripts/test_epub_cleanup_loop.py
          python3 scripts/test_epub3_migration_harness.py
          python3 scripts/test_epub_preflight_harness.py
          python3 scripts/test_epub_refinement_harness.py
          python3 scripts/test_validate_epub_style_demo.py
          python3 scripts/test_validate_skills_basic.py
          python3 scripts/test_validate_ai_entrypoints.py
          python3 scripts/validate_ai_entrypoints.py
          scripts/validate-epub-style-demo.sh --epub "$epub"
          scripts/validate-popup-notes.sh --epub "$epub"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install EPUBCheck
        run: |
          curl -L -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q epubcheck.zip -d "$RUNNER_TEMP/epubcheck"
          echo "EPUBCHECK_JAR=$RUNNER_TEMP/epubcheck/epubcheck-5.1.0/epubcheck.jar" >> "$GITHUB_ENV"

      - name: Validate with EPUBCheck
        run: |
          epub=$(ls templates/epub-style-demo/dist/*.epub | head -n 1)
          # 以 EPUBCheck 退出码作为权威 gate；XML grep 只用于输出可读日志。
          status=0
          java -jar "$EPUBCHECK_JAR" "$epub" --mode epub --profile default --out "$epub.epubcheck.xml" || status=$?
          report="$epub.epubcheck.xml"
          if [ -f "$report" ]; then
            grep -E 'severity="[Ee][Rr][Rr][Oo][Rr]"|severity="[Ff][Aa][Tt][Aa][Ll]"' "$report" >&2 || true
          else
            echo "EPUBCheck 没有产出报告 $report" >&2
          fi
          if [ "$status" -ne 0 ]; then
            echo "EPUBCheck 退出码 $status：存在 ERROR/FATAL" >&2
            exit 1
          fi
          echo "EPUBCheck: 通过（退出码 0）"

      - name: Build & EPUBCheck demo-books samples
        run: |
          bash samples/demo-books/build.sh
          for epub in samples/demo-books/dist/*.epub; do
            case "$(basename "$epub")" in
              redline-trap-after-text-changed.epub)
                echo "[expected-fail sample] skip EPUBCheck: $epub" ;;
              *)
                java -jar "$EPUBCHECK_JAR" "$epub" --mode epub --profile default || { echo "FAIL: $epub" >&2; exit 1; } ;;
            esac
          done

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: epub-style-demo-${{ github.sha }}
          path: templates/epub-style-demo/dist/*.epub
          if-no-files-found: error
          retention-days: 30

      - name: Upload EPUBCheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epubcheck-report-${{ github.sha }}
          path: templates/epub-style-demo/dist/*.epub.epubcheck.xml
          if-no-files-found: error
          retention-days: 30
