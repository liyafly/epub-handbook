name: Build EPUB Demo

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths-ignore: ['archive/**', 'work/**']
  pull_request:
    paths-ignore: ['archive/**', 'work/**']

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Clean dist
        run: rm -rf templates/epub-style-demo/dist

      - name: Build demo EPUB
        run: sh templates/epub-style-demo/build.sh

      - name: Lint Markdown
        run: |
          npm install -g markdownlint-cli2@0.23.3
          markdownlint-cli2 --config .markdownlint-cli2.jsonc \
            'README.md' 'CONTRIBUTING.md' 'CHANGELOG.md' 'AGENTS.md' 'CLAUDE.md' \
            'THIRD_PARTY.md' 'contracts/**/*.md' \
            'records/**/*.md' 'references/**/*.md' 'hooks/**/*.md' \
            'tools-font/**/*.md' \
            'docs/README.md' \
            'docs/final/**/*.md' 'docs/learn/**/*.md' \
            'docs/how-to/**/*.md' 'docs/pipeline/**/*.md' 'skills/**/*.md'

      - name: Reader matrix evidence guard
        run: sh .github/scripts/reader-matrix-guard.sh docs/final/reader-matrix.yaml

      - name: Build and test
        run: |
          go build ./...
          go test ./...

      - name: Smoke book workspace starter
        shell: bash
        run: |
          book="$RUNNER_TEMP/book starter smoke"
          output="$book/03 制作工作区/dist/book.epub"
          go build -o "$RUNNER_TEMP/epub" ./cmd/epub
          sh templates/book-starter/new-book.sh "$book"
          test -f "$book/README.md"
          test ! -f "$book/03 制作工作区/epub/README.md"
          EPUB_BIN="$RUNNER_TEMP/epub" sh "$book/03 制作工作区/epub/build.sh"
          test -s "$output"
          chapter="$book/03 制作工作区/epub/OEBPS/Text/01-chapter.xhtml"
          cp "$chapter" "$RUNNER_TEMP/book-starter-chapter.xhtml"
          before_sha=$(sha256sum "$output" | cut -d ' ' -f 1)
          python3 - "$chapter" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          marker = "</body>"
          if marker not in source:
              raise SystemExit("starter chapter has no body end tag")
          path.write_text(source.replace(marker, '<img src="../Images/missing.png"/><a href="#missing-anchor">bad anchor</a>\n</body>', 1))
          PY
          if EPUB_BIN="$RUNNER_TEMP/epub" sh "$book/03 制作工作区/epub/build.sh" >"$RUNNER_TEMP/book-starter-broken-reference.log" 2>&1; then
            echo "Expected broken XHTML resource and fragment references to fail the build." >&2
            exit 1
          fi
          grep -q 'XHTML local image target is missing from the ZIP archive' "$RUNNER_TEMP/book-starter-broken-reference.log"
          grep -q 'OEBPS/Images/missing.png' "$RUNNER_TEMP/book-starter-broken-reference.log"
          grep -q 'XHTML fragment target ID is missing' "$RUNNER_TEMP/book-starter-broken-reference.log"
          grep -q 'missing-anchor' "$RUNNER_TEMP/book-starter-broken-reference.log"
          after_sha=$(sha256sum "$output" | cut -d ' ' -f 1)
          test "$before_sha" = "$after_sha"
          cp "$RUNNER_TEMP/book-starter-chapter.xhtml" "$chapter"
          EPUB_BIN="$RUNNER_TEMP/epub" sh "$book/03 制作工作区/epub/build.sh"
          test -s "$output"
          before_sha=$(sha256sum "$output" | cut -d ' ' -f 1)
          printf '\n<broken' >> "$book/03 制作工作区/epub/OEBPS/package.opf"
          if EPUB_BIN="$RUNNER_TEMP/epub" sh "$book/03 制作工作区/epub/build.sh" >"$RUNNER_TEMP/book-starter-failed-build.log" 2>&1; then
            echo "Expected a malformed source build to fail." >&2
            exit 1
          fi
          after_sha=$(sha256sum "$output" | cut -d ' ' -f 1)
          test "$before_sha" = "$after_sha"
          epub_count=$(find "$book/03 制作工作区" -type f -name '*.epub' | wc -l | tr -d ' ')
          test "$epub_count" = 1

      - name: Smoke release binary outside checkout
        shell: bash
        run: >-
          bash .github/scripts/release-smoke.sh
          "$RUNNER_TEMP/epub"
          "$(sed -n 's/^[[:space:]]*version *= *"\(.*\)"$/\1/p' cmd/epub/version.go)"
          linux amd64

      - name: Verify deterministic EPUB builds
        shell: bash
        run: |
          demo_a="$RUNNER_TEMP/style demo a"
          demo_b="$RUNNER_TEMP/style demo b"
          cp -R templates/epub-style-demo "$demo_a"
          cp -R templates/epub-style-demo "$demo_b"
          touch -t 198101010000 "$demo_b/OEBPS/Text/01-body.xhtml"
          sh "$demo_a/build.sh"
          sh "$demo_b/build.sh"
          demo_sha_a=$(sha256sum "$demo_a/dist/epub-style-demo.epub" | cut -d ' ' -f 1)
          demo_sha_b=$(sha256sum "$demo_b/dist/epub-style-demo.epub" | cut -d ' ' -f 1)
          demo_sha_source=$(sha256sum templates/epub-style-demo/dist/epub-style-demo.epub | cut -d ' ' -f 1)
          test "$demo_sha_a" = "$demo_sha_b"
          test "$demo_sha_a" = "$demo_sha_source"
          printf 'Deterministic style demo SHA256=%s\n' "$demo_sha_a"

          starter="$RUNNER_TEMP/book starter reproducibility seed"
          book_a="$RUNNER_TEMP/book starter reproducibility a"
          book_b="$RUNNER_TEMP/book starter reproducibility b"
          sh templates/book-starter/new-book.sh "$starter"
          cp -R "$starter" "$book_a"
          cp -R "$starter" "$book_b"
          touch -t 198101010000 "$book_b/03 制作工作区/epub/OEBPS/Text/01-chapter.xhtml"
          EPUB_BIN="$RUNNER_TEMP/epub" sh "$book_a/03 制作工作区/epub/build.sh"
          EPUB_BIN="$RUNNER_TEMP/epub" sh "$book_b/03 制作工作区/epub/build.sh"
          book_sha_a=$(sha256sum "$book_a/03 制作工作区/dist/book.epub" | cut -d ' ' -f 1)
          book_sha_b=$(sha256sum "$book_b/03 制作工作区/dist/book.epub" | cut -d ' ' -f 1)
          test "$book_sha_a" = "$book_sha_b"
          printf 'Deterministic book starter SHA256=%s\n' "$book_sha_a"

      - name: Validate demo artifact with epub CLI
        run: |
          epub=$(ls templates/epub-style-demo/dist/*.epub | head -n 1)
          go run ./cmd/epub run epub.style.demo.maintain --input "$epub" --json
          go run ./cmd/epub run epub.notes.popup.normalize --input "$epub" --json

      - name: Build and validate style preset candidates
        shell: bash
        run: |
          if grep -nE '^em \{.*text-emphasis: filled' templates/style-presets/fiction-en/Styles/base.css; then
            echo "English fiction preset must not apply CJK emphasis marks to em." >&2
            exit 1
          fi
          grep -qx 'em { font-style: italic; }' templates/style-presets/fiction-en/Styles/base.css
          grep -qx '.english-fiction em { font-style: italic; text-emphasis: none; -webkit-text-emphasis: none; }' templates/style-presets/fiction-en/Styles/literary.css
          grep -q '^\.english-fiction em {' templates/epub-style-demo/OEBPS/Styles/literary.css
          grep -q '<em>' templates/epub-style-demo/OEBPS/Text/18-english-fiction.xhtml
          demo_epub=$(ls templates/epub-style-demo/dist/*.epub | head -n 1)
          candidates="$RUNNER_TEMP/style-preset-candidates"
          mkdir -p "$candidates"
          while IFS=: read -r preset scope; do
            candidate="$candidates/$preset.epub"
            scope_arg="scope_paths=[\"$scope\"]"
            go run ./cmd/epub run epub.typography.optimize \
              --input "$demo_epub" --output "$candidate" --json \
              "preset=$preset" "$scope_arg" >/dev/null
            go run ./cmd/epub redline --check all --json "$demo_epub" "$candidate" >/dev/null
            go run ./cmd/epub run epub.package.nav.audit --input "$candidate" --json >/dev/null
            go run ./cmd/epub run epub.notes.popup.normalize --input "$candidate" --json >/dev/null
            go run ./cmd/epub run epub.style.demo.maintain --input "$candidate" --json >/dev/null
          done <<'EOF'
          plain-cn:OEBPS/Text/01-body.xhtml
          poetry-cn:OEBPS/Text/29-poetry.xhtml
          fiction-en:OEBPS/Text/18-english-fiction.xhtml
          EOF
          minified_input="$RUNNER_TEMP/style-preset-minified.epub"
          python3 - "$demo_epub" "$minified_input" <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import sys

          source, output = map(Path, sys.argv[1:])
          target = "OEBPS/Text/01-body.xhtml"
          with ZipFile(source) as src, ZipFile(output, "w") as dst:
              for item in src.infolist():
                  data = src.read(item.filename)
                  if item.filename == target:
                      marker = b"\n</head>"
                      if marker not in data:
                          raise SystemExit(f"expected standalone head close in {target}")
                      data = data.replace(marker, b"</head>", 1)
                  dst.writestr(item, data)
          PY
          whole_candidate="$candidates/literary-cn-minified-whole.epub"
          go run ./cmd/epub run epub.typography.optimize \
            --input "$minified_input" --output "$whole_candidate" --json preset=literary-cn >/dev/null
          go run ./cmd/epub redline --check all --json "$minified_input" "$whole_candidate" >/dev/null
          go run ./cmd/epub run epub.package.nav.audit --input "$whole_candidate" --json >/dev/null

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install EPUBCheck
        run: bash .github/scripts/install-epubcheck.sh

      - name: Validate book starter with EPUBCheck
        run: java -jar "$EPUBCHECK_JAR" "$RUNNER_TEMP/book starter smoke/03 制作工作区/dist/book.epub" --mode epub --profile default

      - name: Validate with EPUBCheck
        run: |
          epub=$(ls templates/epub-style-demo/dist/*.epub | head -n 1)
          # 以 EPUBCheck 退出码作为权威 gate；XML grep 只用于输出可读日志。
          status=0
          java -jar "$EPUBCHECK_JAR" "$epub" --mode epub --profile default --out "$epub.epubcheck.xml" || status=$?
          report="$epub.epubcheck.xml"
          if [ -f "$report" ]; then
            grep -E 'severity="[Ee][Rr][Rr][Oo][Rr]"|severity="[Ff][Aa][Tt][Aa][Ll]"' "$report" >&2 || true
          else
            echo "EPUBCheck 没有产出报告 $report" >&2
          fi
          if [ "$status" -ne 0 ]; then
            echo "EPUBCheck 退出码 $status：存在 ERROR/FATAL" >&2
            exit 1
          fi
          echo "EPUBCheck: 通过（退出码 0）"

      - name: EPUBCheck style preset candidates
        run: |
          for candidate in "$RUNNER_TEMP"/style-preset-candidates/*.epub; do
            test -s "$candidate"
            java -jar "$EPUBCHECK_JAR" "$candidate" --mode epub --profile default
          done

      - name: Build & EPUBCheck cleanup demo books
        run: |
          bash templates/cleanup-demo-books/build.sh
          for epub in templates/cleanup-demo-books/dist/*.epub; do
            case "$(basename "$epub")" in
              redline-trap-after-text-changed.epub)
                echo "[expected-fail sample] skip EPUBCheck: $epub" ;;
              *)
                java -jar "$EPUBCHECK_JAR" "$epub" --mode epub --profile default || { echo "FAIL: $epub" >&2; exit 1; } ;;
            esac
          done
          go run ./cmd/epub redline --check all \
            templates/cleanup-demo-books/dist/city-field-notes-before.epub \
            templates/cleanup-demo-books/dist/city-field-notes-after-clean.epub
          go run ./cmd/epub redline --check all \
            templates/cleanup-demo-books/dist/paper-garden-before.epub \
            templates/cleanup-demo-books/dist/paper-garden-after-clean.epub
          trap_report="$RUNNER_TEMP/redline-trap-redline.txt"
          if go run ./cmd/epub redline --check all \
            templates/cleanup-demo-books/dist/redline-trap-before.epub \
            templates/cleanup-demo-books/dist/redline-trap-after-text-changed.epub \
            >"$trap_report" 2>&1; then
            echo "redline-trap unexpectedly passed" >&2
            cat "$trap_report" >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ] || ! grep -q '^text: modified ' "$trap_report"; then
              echo "redline-trap failed for an unexpected reason (exit $status)" >&2
              cat "$trap_report" >&2
              exit 1
            fi
            cat "$trap_report"
            echo "redline-trap: expected text redline failure (exit 1)"
          fi
          legacy_before=templates/cleanup-demo-books/dist/legacy-epub2-before.epub
          legacy_migrated="$RUNNER_TEMP/legacy-epub2-migrated.epub"
          legacy_normalized="$RUNNER_TEMP/legacy-epub2-normalized.epub"
          go run ./cmd/epub run epub.package.migrate.epub3 \
            --input "$legacy_before" --output "$legacy_migrated" --json \
            > "$RUNNER_TEMP/legacy-epub2-migration.json"
          python3 - "$legacy_before" "$legacy_migrated" <<'PY'
          import sys
          import zipfile

          note_ref = b'<a href="notes.xhtml#m1"><sup>[1]</sup></a>'
          with zipfile.ZipFile(sys.argv[1]) as before_zip, zipfile.ZipFile(sys.argv[2]) as after_zip:
              before = before_zip.read("OEBPS/Text/ch1.xhtml")
              after = after_zip.read("OEBPS/Text/ch1.xhtml")
          if before.count(note_ref) != 1 or after.count(note_ref) != 1:
              raise SystemExit("X1 legacy [1] markup did not remain unchanged after migration")
          PY
          go run ./cmd/epub redline --check all "$legacy_before" "$legacy_migrated"
          go run ./cmd/epub run epub.structure.normalize \
            --input "$legacy_before" --output "$legacy_normalized" --json \
            > "$RUNNER_TEMP/legacy-epub2-normalize.json"
          python3 - "$RUNNER_TEMP/legacy-epub2-normalize.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report_file:
              report = json.load(report_file)
          mappings = report.get("facts", {}).get("epub.structure.normalize.mappings", [])
          if len(mappings) != 0:
              raise SystemExit(f"X1 normalize sample must remain a no-op; mappings={mappings!r}")
          PY
          mkdir -p "$RUNNER_TEMP/legacy-css-before" "$RUNNER_TEMP/legacy-css-after"
          unzip -p "$legacy_before" OEBPS/Styles/legacy.css > "$RUNNER_TEMP/legacy-css-before/legacy.css"
          unzip -p "$legacy_normalized" OEBPS/Styles/legacy.css > "$RUNNER_TEMP/legacy-css-after/legacy.css"
          cmp "$RUNNER_TEMP/legacy-css-before/legacy.css" "$RUNNER_TEMP/legacy-css-after/legacy.css"
          unzip -p "$legacy_before" OEBPS/Styles/latin1.css > "$RUNNER_TEMP/legacy-css-before/latin1.css"
          unzip -p "$legacy_normalized" OEBPS/Styles/latin1.css > "$RUNNER_TEMP/legacy-css-after/latin1.css"
          cmp "$RUNNER_TEMP/legacy-css-before/latin1.css" "$RUNNER_TEMP/legacy-css-after/latin1.css"
          non_utf8_rename="$RUNNER_TEMP/legacy-epub2-gb18030-rename.epub"
          non_utf8_output="$RUNNER_TEMP/legacy-epub2-gb18030-output.epub"
          non_utf8_report="$RUNNER_TEMP/legacy-epub2-gb18030-report.json"
          python3 - "$legacy_before" "$non_utf8_rename" <<'PY'
          import copy
          import sys
          import zipfile

          source, output = sys.argv[1:]
          with zipfile.ZipFile(source) as src, zipfile.ZipFile(output, "w") as dst:
              for original in src.infolist():
                  item = copy.copy(original)
                  data = src.read(original.filename)
                  if original.filename == "OEBPS/package.opf":
                      data = data.replace(b'href="Styles/book.css"', b'href="book.css"', 1)
                  elif original.filename == "OEBPS/Styles/book.css":
                      item.filename = "OEBPS/book.css"
                  elif original.filename == "OEBPS/Styles/latin1.css":
                      data = b"/* ASCII-only variant */\nbody { font-family: serif; }\n"
                  dst.writestr(item, data)
          PY
          if "$RUNNER_TEMP/epub" run epub.structure.normalize \
            --input "$non_utf8_rename" --output "$non_utf8_output" --json \
            > "$non_utf8_report" 2>&1; then
            echo "normalize unexpectedly accepted a renamed book with GB18030 CSS" >&2
            cat "$non_utf8_report" >&2
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "non-UTF-8 normalize failed with unexpected exit $status" >&2
              cat "$non_utf8_report" >&2
              exit 1
            fi
          fi
          test ! -e "$non_utf8_output"
          python3 - "$non_utf8_report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report_file:
              report = json.load(report_file)
          errors = [f for f in report.get("findings", []) if f.get("level") == "error"]
          detail = " ".join(f.get("detail", "") for f in errors)
          if report.get("status") != "failed" or not any(
              "structure.non-utf8-text" in f.get("detail", "") for f in errors
          ) or "OEBPS/Styles/legacy.css" not in detail or "先人工转码为 UTF-8，再重新 S0 冻结" not in detail:
              raise SystemExit(f"GB18030 normalize did not report the expected error: {report}")
          PY
          java -jar "$EPUBCHECK_JAR" "$legacy_migrated" --mode epub --profile default

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v7
        with:
          name: epub-style-demo-${{ github.sha }}
          path: templates/epub-style-demo/dist/*.epub
          if-no-files-found: error
          retention-days: 30

      - name: Upload EPUBCheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epubcheck-report-${{ github.sha }}
          path: templates/epub-style-demo/dist/*.epub.epubcheck.xml
          if-no-files-found: warn
          retention-days: 30
