[project]
name = "epub-font"
version = "1.0.0"
description = "Subset the fonts of an EPUB (static or variable) to the book's characters, and check full coverage"
requires-python = ">=3.12"
dependencies = [
    "fonttools[woff]>=4.60",
    "tinycss2>=1.3",
    "lxml>=5.0",
]

[project.scripts]
epub-font = "epub_font.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["epub_font"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
