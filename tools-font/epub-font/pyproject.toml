[project]
name = "epub-font"
version = "2.1.0"
description = "Subset EPUB fonts (static or variable) to whole-book or CSS-role characters, and check full coverage"
requires-python = ">=3.12"
dependencies = [
    "fonttools[woff]>=4.60",
    "tinycss2>=1.3",
    "lxml>=5.0",
]

[project.scripts]
epub-font = "epub_font.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["epub_font"]

[tool.hatch.build.targets.wheel.force-include]
"epub_font/coverage/font-coverage-viewer.html" = "epub_font/coverage/font-coverage-viewer.html"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
