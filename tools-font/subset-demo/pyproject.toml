[project]
name = "epub-font-subset-demo"
version = "0.1.0"
description = "Demo: subset static or variable fonts for an EPUB to the book's character set, then verify cmap/UVS/vertical/axes"
requires-python = ">=3.12"
dependencies = [
    "fonttools[woff]>=4.60",
    "tinycss2>=1.3",
    "lxml>=5.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
