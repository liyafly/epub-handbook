<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字体覆盖报告</title>
<style>
:root{--bg:#f6f4ef;--card:#fffdf8;--ink:#23211d;--muted:#716d64;--line:#d8d0c3;--ok:#5a9e6f;--risk:#c8912b;--fail:#c44;--pua:#8b5cf6}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);max-width:1200px;margin:0 auto;padding:16px;line-height:1.5}
h1{font-size:1.2em}h2{font-size:1em;margin:12px 0 6px}
.drop-zone{border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center;cursor:pointer;margin-bottom:10px;transition:.2s}
.drop-zone.drag-over{border-color:#8f4f20;background:#fdf6ee}
.drop-zone p{color:var(--muted);font-size:.85em}
.drop-zone input,.drop-zone input[type=file]{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px;margin-bottom:10px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat-card .num{font-size:1.2em;font-weight:700}.stat-card .label{font-size:.7em;color:var(--muted)}
.ok-num{color:var(--ok)}.risk-num{color:var(--risk)}.fail-num{color:var(--fail)}

/* Problem list */
.problem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px;margin-bottom:12px}
.problem-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.problem-card .char-big{font-size:2.8em;line-height:1;text-align:center;min-height:1.1em}
.problem-card .char-big.tofu{color:#ddd}
.problem-card .meta{font-size:.75em;color:var(--muted);margin-top:4px}
.problem-card .fix{font-size:.75em;background:#e8f5e9;padding:3px 6px;border-radius:4px;margin-top:4px;line-height:1.3}
.badge{display:inline-block;padding:1px 5px;border-radius:6px;font-size:.68em;font-weight:600;margin:0 1px}
.b-extb{background:#fde8f0;color:#a36}.b-pua{background:#f3edff;color:#8b5cf6}.b-fail{background:#fde8e8;color:var(--fail)}.b-risk{background:#fef3e0;color:var(--risk)}

.tab-bar{display:flex;gap:4px;margin:10px 0 6px;flex-wrap:wrap}
.tab{font-size:.78em;padding:4px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--card)}
.tab.active{background:var(--ink);color:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.8em;background:var(--card);border:1px solid var(--line)}
th{background:#f0ece4;padding:5px 7px;text-align:left;font-size:.75em;color:var(--muted)}
td{padding:4px 7px;border-top:1px solid #f0ece4}.cp-mono{font-family:monospace;font-size:.8em;color:var(--muted)}
.font-zone{margin-bottom:8px;font-size:.78em;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.empty{text-align:center;color:#ccc;padding:60px 0}
</style>
</head>
<body>

<h1>🔤 字体覆盖报告</h1>
<div class="drop-zone" id="dropZone">
  <p>⬇ 拖入 <b>coverage JSON</b> 或 <b>EPUB 文件</b>（加载字体）+ 也可拖入 .ttf/.otf</p>
  <input type="file" id="fileInput" multiple>
</div>
<div class="font-zone" id="fontZone" style="display:none">字体：点击或拖入 EPUB/ttf/otf 加载内嵌字体用于字形对比</div>
<div id="content"><p class="empty">拖入 coverage JSON 报告文件开始</p></div>

<script>
let report=null,loadedFonts={};

const dz=document.getElementById('dropZone'),fi=document.getElementById('fileInput'),
  fz=document.getElementById('fontZone'),ct=document.getElementById('content');

dz.addEventListener('click',()=>fi.click());
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over')});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');handleFiles(e.dataTransfer.files)});
fi.addEventListener('change',()=>handleFiles(fi.files));

async function handleFiles(files){
  let gotReport=false,gotFonts=false;
  for(const f of files){
    if(f.name.endsWith('.json')||f.type==='application/json'){
      await new Promise(r=>{const fr=new FileReader();fr.onload=()=>{try{report=JSON.parse(fr.result);gotReport=true}catch(e){ct.innerHTML='<p class=empty style=color:var(--fail)>JSON parse error</p>'}};fr.readAsText(f);setTimeout(r,100)});
    }
  }
  if(!gotReport){ct.innerHTML='<p class=empty style=color:var(--fail)>请拖入 coverage JSON 报告文件（.json）</p>';return}
  _embeddedLoaded=false;  // reset for new report
  for(const f of files){
    const ext=f.name.split('.').pop().toLowerCase();
    if(f.name.endsWith('.epub')){await loadFromEpub(f);gotFonts=true}
    else if(/^(ttf|otf|woff|woff2)$/.test(ext)){await loadFont(f);gotFonts=true}
  }
  updateFontInfo();await renderAll();
}
async function loadFont(f){
  const buf=await f.arrayBuffer();
  await loadFontFile(new Blob([buf]),f.name);
}

// ZIP reader for EPUB font extraction
async function* zipEntries(buf){
  const dv=new DataView(buf);let eocd=buf.byteLength-22;
  while(eocd>0){if(dv.getUint32(eocd,true)===0x06054b50)break;eocd--}
  if(eocd<=0)return;
  const cdOff=dv.getUint32(eocd+16,true),total=dv.getUint16(eocd+10,true);
  let pos=cdOff;
  for(let i=0;i<total;i++){
    if(dv.getUint32(pos,true)!==0x02014b50)break;
    const method=dv.getUint16(pos+10,true),cSize=dv.getUint32(pos+20,true),
      nLen=dv.getUint16(pos+28,true),exLen=dv.getUint16(pos+30,true),
      cmLen=dv.getUint16(pos+32,true),lhOff=dv.getUint32(pos+42,true);
    const name=new TextDecoder().decode(new Uint8Array(buf,pos+46,nLen));
    pos+=46+nLen+exLen+cmLen;
    // Read LOCAL header (not central dir) to get actual data offset
    const locNL=dv.getUint16(lhOff+26,true),locEL=dv.getUint16(lhOff+28,true);
    const dataOff=lhOff+30+locNL+locEL;
    if(!/\.(ttf|otf|woff|woff2)$/i.test(name))continue;
    if(method===0){
      yield{name,data:new Uint8Array(buf,dataOff,cSize)};
    }else if(method===8){
      try{
        const raw=new Uint8Array(buf,dataOff,cSize);
        // ZIP uses raw deflate (RFC 1951), NOT zlib-wrapped (RFC 1950)
        const ds=new DecompressionStream('deflate-raw');
        const w=ds.writable.getWriter(),r=ds.readable.getReader();
        await w.write(raw);
        await w.close();
        let cs=[],t=0;
        while(1){const{value,done}=await r.read();if(done)break;cs.push(value);t+=value.length}
        const out=new Uint8Array(t);let p=0;for(const c of cs){out.set(c,p);p+=c.length}
        yield{name,data:out};
      }catch(e){console.warn('deflate fail:',name,e)}
    }
  }
}
async function loadFromEpub(f){
  const buf=await f.arrayBuffer();let count=0;
  for await(const e of zipEntries(buf)){
    const blob=new Blob([e.data]),fname=e.name.split('/').pop();
    await loadFontFile(blob,fname);count++;
  }
  fz.innerHTML='字体：从 EPUB 加载了 <b>'+count+'</b> 个 <button onclick=renderAll() style=margin-left:8px;font-size:.75em>刷新显示</button>';
  fz.style.display='block';await renderAll();
}

// Load font from blob with proper name tracking
// Load all embedded fonts from report (base64, no ZIP needed)
async function loadEmbeddedFonts(ef){
  const pending=[];
  for(const [path,fd] of Object.entries(ef)){
    const fname=path.split('/').pop(),key=fname.toLowerCase().replace(/[^a-z0-9]/g,'');
    if(loadedFonts[key])continue; // already loaded
    // Decode base64 to binary
    const bin=atob(fd.data),bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const ext=fname.split('.').pop().toLowerCase(),mime=ext==='otf'?'font/otf':'font/ttf';
    pending.push(loadFontFile(new Blob([bytes],{type:mime}),fname));
  }
  if(pending.length)await Promise.all(pending);
}
function base64ToBlob(b64,mime){
  const bin=atob(b64),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new Blob([bytes],{type:mime});
}
// Load one font from a blob, register a FontFace, index it for matching
async function loadFontFile(blob,fname){
  try{
    const buf=await blob.arrayBuffer(),ext=fname.split('.').pop().toLowerCase(),
      fmt=ext==='otf'?'opentype':ext==='woff'?'woff':'truetype',
      fn='f'+Math.random().toString(36).slice(2,8);
    const face=new FontFace(fn,buf,{style:'normal',weight:'normal'});
    await face.load();document.fonts.add(face);
    // Index by multiple keys for robust matching
    const base=fname.replace(/\.[^.]+$/,''),key=base.toLowerCase().replace(/[^a-z0-9]/g,'');
    loadedFonts[key]={face,fontName:fn,name:fname,basename:base};
    // Also index by common CJK font name patterns
    const short=base.replace(/[-_]/g,'').toLowerCase();
    loadedFonts[short]={face,fontName:fn,name:fname,basename:base};
    // Read family name from name table for exact matching
    try{const fam=readFontFamily(new Uint8Array(buf));if(fam){loadedFonts[fam.toLowerCase().replace(/[^a-z0-9]/g,'')]=loadedFonts[key];loadedFonts[fam.toLowerCase()]=loadedFonts[key]}}catch(e){}
  }catch(e){console.warn('font load fail:',fname,e)}
}
// Quick font family name read from SFNT name table
function readFontFamily(bytes){
  try{
    const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
    const sfnt=dv.getUint32(0);let off=0;
    if(sfnt===0x74746366){off=dv.getUint32(12)} // ttc: first face
    else if(sfnt===0x00010000||sfnt===0x4F54544F){} // ttf/otf
    else if(sfnt===0x774F4646)return null; // woff - skip for now
    else return null;
    const nTables=dv.getUint16(off+4);
    for(let i=0;i<nTables;i++){
      const tag=String.fromCharCode(dv.getUint8(off+12+i*16),dv.getUint8(off+12+i*16+1),dv.getUint8(off+12+i*16+2),dv.getUint8(off+12+i*16+3));
      if(tag==='name'){
        const no=dv.getUint32(off+12+i*16+8),nl=dv.getUint32(off+12+i*16+12);
        return readNameRecord(new Uint8Array(bytes.buffer,bytes.byteOffset+no,nl));
      }
    }
  }catch(e){}
  return null;
}
function readNameRecord(bytes){
  try{
    const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
    const count=dv.getUint16(2),so=dv.getUint16(4);
    for(let i=0;i<count;i++){
      const ro=6+i*12;
      const pid=dv.getUint16(ro),nid=dv.getUint16(ro+6),len=dv.getUint16(ro+8),off=dv.getUint16(ro+10);
      if(nid===1){ // Family name
        const b=new Uint8Array(bytes.buffer,bytes.byteOffset+so+off,len);
        return new TextDecoder('utf-16be').decode(b).replace(/\0$/,'').trim();
      }
    }
  }catch(e){}
  return null;
}
function updateFontInfo(){
  const n=Object.keys(loadedFonts).length;
  if(!n)return;
  fz.innerHTML='字体：已加载 <b>'+n+'</b> 个 <span style="font-size:.75em">('+[...new Set(Object.values(loadedFonts).map(f=>f.name))].join(', ')+')</span>';
  fz.style.display='block';
}
fz.addEventListener('dragover',e=>e.preventDefault());
fz.addEventListener('drop',async e=>{e.preventDefault();for(const f of e.dataTransfer.files)await loadFont(f);updateFontInfo();await renderAll()});
fz.addEventListener('click',()=>{const inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.accept='.ttf,.otf,.woff,.woff2,.epub';inp.onchange=async()=>{for(const f of inp.files)await loadFont(f);updateFontInfo();await renderAll()};inp.click()});

function findFont(name, ci){
  if(!Object.keys(loadedFonts).length)return null;
  // First try matching by _font_file (exact ZIP path match)
  if(ci&&ci._font_file){
    const ff=ci._font_file.split('/').pop().toLowerCase().replace(/[^a-z0-9]/g,'');
    for(const [key,lf] of Object.entries(loadedFonts)){
      if(key.includes(ff)||ff.includes(key))return lf;
      const bn=(lf.basename||lf.name||'').toLowerCase().replace(/[^a-z0-9]/g,'');
      if(bn.includes(ff)||ff.includes(bn))return lf;
    }
  }
  // Then try _real_family
  if(ci&&ci._real_family){
    const rf=ci._real_family.toLowerCase().replace(/[^a-z0-9]/g,'');
    for(const [key,lf] of Object.entries(loadedFonts)){
      if(key.includes(rf)||rf.includes(key))return lf;
    }
  }
  // Then by name/covered_by
  if(!name)return null;
  const k=name.toLowerCase().replace(/[^a-z0-9]/g,'');
  if(loadedFonts[k])return loadedFonts[k];
  const nk=name.toLowerCase();
  for(const [key,lf] of Object.entries(loadedFonts)){
    if(key.includes(nk)||nk.includes(key))return lf;
    if(lf.name&&(lf.name.toLowerCase().includes(nk)||nk.includes(lf.name.toLowerCase())))return lf;
  }
  return null;
}

let _embeddedLoaded=false;
async function renderAll(){
  if(!report)return;
  // Auto-load fonts embedded in report (base64)
  if(report._embedded_fonts&&!_embeddedLoaded){_embeddedLoaded=true;await loadEmbeddedFonts(report._embedded_fonts);updateFontInfo()}
  const s=report.summary,chars=report.char_inventory,fonts=report.fonts?.embedded||[];
  const kp=s.by_profile_risk?.['kindle-pessimistic']||{ok:0,risk:0,fail:0};
  const ib=s.by_profile_risk?.['ideal-browser']||{ok:0,risk:0,fail:0};

  // Group problem chars: out-of-range = Ext B+ and PUA (rare / special)
  const extb=[],pua=[];
  chars.forEach(ci=>{
    const cp=parseInt(ci.cp.slice(2),16);
    if(cp>=0x20000)extb.push(ci);
    else if((cp>=0xE000&&cp<=0xF8FF)||cp>=0xF0000)pua.push(ci);
  });

  const causeCounts={};
  chars.forEach(ci=>{(ci._causes||[]).forEach(c=>{causeCounts[c]=(causeCounts[c]||0)+1})});

  ct.innerHTML=`
    <div class="stats">
      <div class="stat-card"><div class="num">${s.unique_chars}</div><div class="label">去重字符</div></div>
      <div class="stat-card"><div class="num ok-num">${kp.ok}</div><div class="label">✅ Kindle 安全</div></div>
      <div class="stat-card"><div class="num risk-num">${kp.risk}</div><div class="label">⚠️ Kindle 风险</div></div>
      <div class="stat-card"><div class="num fail-num">${kp.fail}</div><div class="label">❌ Kindle 失败</div></div>
      <div class="stat-card"><div class="num">${s.rare_count||0}</div><div class="label">生僻字</div></div>
      <div class="stat-card"><div class="num">${s.out_of_standard||0}</div><div class="label">出 GBK</div></div>
    </div>
    <div style="margin:6px 0">
      <button onclick="copyChars('rare-uncovered')" style="font-size:.78em;padding:4px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--card)">📋 复制生僻·未覆盖字（→大字库/造字）</button>
      <button onclick="copyChars('rare')" style="font-size:.78em;padding:4px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--card)">📋 复制全部生僻字</button>
      <button onclick="copyChars('uncovered')" style="font-size:.78em;padding:4px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--card)">📋 复制全部未覆盖字</button>
      <span id="copyHint" style="font-size:.75em;color:var(--muted);margin-left:8px"></span>
    </div>
    ${Object.keys(causeCounts).length?`<div style="font-size:.78em;color:var(--muted);margin-bottom:8px">原因：
      ${Object.entries(causeCounts).map(([c,n])=>'<span style="margin:0 6px">'+causeLabel(c)+': '+n+'</span>').join('')}
    </div>`:''}

    ${extb.length||pua.length?`
    <h2>🔴 超出范围字符 (${extb.length+pua.length})
      <button onclick="copyOutOfRange()" style="font-size:.6em;font-weight:400;padding:3px 8px;margin-left:8px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--card)">📋 复制这些字</button>
      <span id="oorCopyHint" style="font-size:.55em;font-weight:400;color:var(--muted);margin-left:6px"></span>
    </h2>
    <p style="font-size:.78em;color:var(--muted);margin-bottom:6px">Ext B+ / PUA 区的稀有字。有内嵌字体覆盖的用内嵌字体显示；标「内嵌无此字」的需要大字库或造字。</p>
    <div class="problem-grid">
      ${extb.map(ci=>problemCard(ci,'extb')).join('')}
      ${pua.map(ci=>problemCard(ci,'pua')).join('')}
    </div>
    `:''}

    ${renderChainHealth()}

    ${renderCandidate()}

    <div class="tab-bar">
      <span class="tab active" onclick="setTab('all',this)">全部 (${chars.length})</span>
      <span class="tab" onclick="setTab('rare',this)">生僻字 (${s.rare_count||0})</span>
      <span class="tab" onclick="setTab('extb',this)">Ext B+ (${extb.length})</span>
      <span class="tab" onclick="setTab('pua',this)">PUA (${pua.length})</span>
      <span class="tab" onclick="setTab('risk',this)">⚠️ 风险 (${kp.risk})</span>
      <span class="tab" onclick="setTab('fail',this)">❌ 失败 (${kp.fail})</span>
    </div>
    <div style="margin-bottom:8px">
      <input id="charFilter" placeholder="搜索字符" style="padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:.85em;width:200px" oninput="applyFilter()">
      <span style="font-size:.78em;color:var(--muted);margin-left:8px" id="filterCount"></span>
    </div>
    <table id="charTable"><thead><tr><th>字符</th><th>码位</th><th>次数</th><th>状态</th><th>内嵌对比</th><th>修复建议</th></tr></thead><tbody></tbody></table>
  `;
  window._chars=chars;window._tab='all';applyFilter();
}

function problemCard(ci,kind){
  try{
  const cby=ci._covered_by||ci._real_family;
  const hasCover=!!ci._has_embedded_cover;
  const ctx=(ci.occurrences&&ci.occurrences[0])?ci.occurrences[0].context||'':'';
  // Render the glyph with its EMBEDDED font when covered; otherwise fall back
  // to the system font (and mark it), never to an arbitrary loaded font.
  const lf=hasCover?findFont(cby, ci):null;
  const glyph=lf
    ? '<span style="font-family:\''+lf.fontName+'\'">'+esc(ci.char)+'</span>'
    : esc(ci.char);
  const badge=hasCover
    ? '<span class="badge b-extb">内嵌:'+esc(cby||'')+'</span>'
    : '<span class="badge b-fail">内嵌无此字</span>';
  const fix=hasCover ? '' :
    '<div class="fix" style="background:#fef3e0">无内嵌字形 → 需大字库覆盖，或造字/合成字库</div>';
  return '<div class="problem-card">'+
    '<div class="char-big" title="点击复制" style="cursor:pointer" onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+esc(ci.char)+'\')">'+glyph+'</div>'+
    '<div class="meta"><b>'+ci.cp+'</b> ×'+ci.count+' '+badge+'</div>'+
    (ctx?'<div class="meta">⋯'+esc(ctx)+'⋯</div>':'')+fix+'</div>';
  }catch(e){return '<div class="problem-card"><div class="meta">渲染错误: '+e.message+'</div></div>'}
}

function copyOutOfRange(){
  const cs=(window._chars||[]).filter(ci=>{const cp=parseInt(ci.cp.slice(2),16);return cp>=0x20000||(cp>=0xE000&&cp<=0xF8FF)||cp>=0xF0000});
  const s=cs.map(ci=>ci.char).join('');
  const hint=document.getElementById('oorCopyHint');
  if(!s){if(hint)hint.textContent='（无）';return}
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>{if(hint)hint.textContent='已复制 '+[...s].length+' 字'},()=>{if(hint)hint.textContent='复制失败，手动选择：'+s});
  else if(hint)hint.textContent='手动复制：'+s;
}

function issueLabel(i){return{
  ['no-font-family-declared']:'❌ 没写 font-family（兜底 serif）',
  ['broken-font-face']:'❌ @font-face 指向的字体在包内缺失',
  ['full-font-not-at-head']:'❌ 全字库没放链首（Kindle 高危）',
  ['subset-only']:'⚠️ 链上只有子集字体',
  ['no-generic-fallback']:'⚠️ 链尾没有 generic 兜底',
  ['generic-only']:'⚠️ 链上只有 generic 字体',
}[i]||i}

function renderChainHealth(){
  const ch=report.chain_health||{},chains=report.chains||[];
  const byId={};chains.forEach(c=>byId[c.id]=c);
  const ids=Object.keys(ch);
  if(!ids.length)return '';
  const rank={fail:0,warn:1,ok:2};
  ids.sort((a,b)=>(rank[ch[a].grade]??9)-(rank[ch[b].grade]??9)||(ch[b].run_count||0)-(ch[a].run_count||0));
  const rows=ids.map(id=>{
    const h=ch[id],c=byId[id]||{resolved:[]};
    const chainText=(c.resolved||[]).map(s=>{
      let n=esc(s.family);
      if(s.embedded)n='<b>'+n+'</b>';
      else if(s.generic)n='<i style="color:var(--muted)">'+n+'</i>';
      else if(s.system_ref)n=n+'<sup style="color:#36a">sys</sup>';
      return n;
    }).join(' → ')||'(空)';
    const gc=h.grade==='fail'?'var(--fail)':h.grade==='warn'?'var(--risk)':'var(--ok)';
    const issues=(h.issues||[]).map(i=>'<div style="font-size:.72em;color:'+gc+'">'+issueLabel(i)+'</div>').join('');
    return '<tr><td style="color:'+gc+';font-weight:700">'+h.grade.toUpperCase()+'</td>'+
      '<td style="font-size:.82em">'+chainText+'</td>'+
      '<td style="text-align:right">'+(h.run_count||0)+'</td>'+
      '<td>'+(issues||'<span style="font-size:.72em;color:var(--muted)">—</span>')+'</td></tr>';
  }).join('');
  return '<h2>🔗 字体链体检 ('+ids.length+' 条链)</h2>'+
    '<table><thead><tr><th>评级</th><th>解析后的字体链（<b>粗体</b>=内嵌，<i>斜体</i>=generic，sys=系统字体引用）</th><th>用量</th><th>问题</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function renderCandidate(){
  const cv=report.candidate_validation;
  if(!cv||cv.error||!cv.missing_chars)return '';
  const residual=cv.missing_chars.map(m=>m.char).join('');
  const rareN=cv.missing_chars.filter(m=>m.rare).length;
  return '<h2>📚 候选大字库验证</h2>'+
    '<div style="font-size:.82em;margin-bottom:6px">字库 <b>'+esc((cv.candidate_font||'').split('/').pop())+'</b>：'+
    '覆盖 '+cv.covered+' / '+cv.total+'，残余 <b style="color:var(--fail)">'+cv.missing+'</b> 个（其中生僻 '+rareN+'）</div>'+
    '<button onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+esc(residual)+'\')" style="font-size:.8em;padding:4px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--card)">📋 复制残余字（造字/合成字库输入）</button>'+
    '<div style="font-size:1.6em;line-height:1.4;margin-top:8px;word-break:break-all">'+esc(residual)+'</div>';
}

function setTab(t,e){window._tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e.classList.add('active');applyFilter()}

function applyFilter(){
  const q=(document.getElementById('charFilter')?.value||'').toLowerCase();
  const tab=window._tab||'all';
  let chars=window._chars||[];
  if(tab==='rare')chars=chars.filter(ci=>ci._rare);
  else if(tab==='extb')chars=chars.filter(ci=>parseInt(ci.cp.slice(2),16)>=0x20000);
  else if(tab==='pua')chars=chars.filter(ci=>{const cp=parseInt(ci.cp.slice(2),16);return(cp>=0xE000&&cp<=0xF8FF)||cp>=0xF0000});
  else if(tab==='risk')chars=chars.filter(ci=>(ci._kindle||'ok')!=='ok');
  else if(tab==='fail')chars=chars.filter(ci=>(ci._pos||'')==='none'||(ci._causes||[]).length>0);
  if(q)chars=chars.filter(ci=>ci.char.includes(q)||ci.cp.toLowerCase().includes(q)||(ci._causes||[]).some(c=>c.includes(q)));

  const tbody=document.querySelector('#charTable tbody');
  if(!tbody)return;
  const fontLoaded=Object.keys(loadedFonts).length>0;
  tbody.innerHTML=chars.map(ci=>{
    const kv=ci._kindle||'fail',badge=kv==='ok'?'<span class=badge style=background:#e8f5e9;color:var(--ok)>✅ 安全</span>'
      :kv==='fail'?'<span class=badge style=background:#fde8e8;color:var(--fail)>❌ 风险</span>'
      :'<span class=badge style=background:#fef3e0;color:var(--risk)>⚠️ 风险</span>';
    const zone=ci._std_zone;
    const zoneBadge=zone==='gbk'?'<span class=badge style="background:#eef6ff;color:#36a">次常用</span>'
      :zone==='out-of-gbk'?'<span class=badge style="background:#fff0e0;color:#b60">出GBK</span>':'';
    const rareBadge=ci._rare?'<span class=badge style="background:#fde8f0;color:#a36">生僻</span>':'';
    const causes=(ci._causes||[]).map(c=>'<span style="font-size:.7em;padding:1px 4px;border-radius:4px;margin:0 1px;background:'+(c==='true-missing'?'#fde8e8':c==='subset-cut'?'#fde8f0':'#fef3e0')+'">'+causeLabel(c)+'</span>').join('');
    const cby=ci._covered_by;
    // Glyph: embedded font if covered; else system font (so it still shows when possible)
    let glyph='<span style="font-size:1.8em">'+esc(ci.char)+'</span>';
    if(ci._has_embedded_cover&&fontLoaded){const lf=findFont(cby,ci);if(lf)glyph='<span style="font-size:1.8em;line-height:1;font-family:\''+lf.fontName+'\'">'+esc(ci.char)+'</span>';}
    // Honest fix advice
    let fix='<span style="font-size:.72em;color:var(--muted)">—</span>';
    if(!ci._has_embedded_cover){ if(ci._rare) fix='<span style="font-size:.72em;color:var(--fail)">无内嵌 → 需大字库/造字</span>'; }
    else if(ci._pos==='first-embedded') fix='<span style="font-size:.72em;color:var(--ok)">✅ 内嵌已覆盖</span>';
    else fix='<span style="font-size:.72em">把 <b>'+esc(cby||'')+'</b> 提到链首</span>';
    return '<tr><td title="点击复制" style="font-size:2em;text-align:center;line-height:1;cursor:pointer" onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+esc(ci.char)+'\')">'+esc(ci.char)+'</td>'+
      '<td class=cp-mono>'+ci.cp+'</td><td style=text-align:right>'+ci.count+'</td>'+
      '<td>'+badge+' '+zoneBadge+rareBadge+' '+causes+'</td>'+
      '<td style=text-align:center>'+glyph+'</td><td>'+fix+'</td></tr>';
  }).join('');
  document.getElementById('filterCount').textContent='显示 '+chars.length+' / '+(window._chars||[]).length;
  if(q&&!chars.length)tbody.innerHTML='<tr><td colspan=6 style=text-align:center;padding:20px;color:var(--muted)>未找到</td></tr>';
}
function causeLabel(c){return{['true-missing']:'真缺字',['fallback-not-reached']:'回退未生效',['subset-cut']:'子集裁切',['unknown']:'未知'}[c]||c}
function _charSet(kind){
  const cs=window._chars||[];
  const picks={
    'rare-uncovered': ci=>ci._rare && !ci._has_embedded_cover,   // 真正要送大字库/造字的
    'rare':           ci=>ci._rare,
    'uncovered':      ci=>!ci._has_embedded_cover,               // 任一链都无嵌入命中
  };
  const pick=picks[kind]||picks['rare-uncovered'];
  return cs.filter(pick).map(ci=>ci.char).join('');
}
function copyChars(kind){
  const s=_charSet(kind);
  const hint=document.getElementById('copyHint');
  if(!s){if(hint)hint.textContent='（没有符合条件的字）';return}
  if(!navigator.clipboard){if(hint)hint.textContent='浏览器不支持自动复制，手动选择：'+s;return}
  navigator.clipboard.writeText(s).then(()=>{
    if(hint)hint.textContent='已复制 '+[...s].length+' 个字，可粘进 font-preview.html 或子集化工具';
  },()=>{if(hint)hint.textContent='复制失败，手动选择：'+s});
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
// Auto-load embedded report data from self-contained HTML
if(window.__REPORT_DATA__){report=window.__REPORT_DATA__;renderAll()}
</script>
</body>
</html>
