<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字体覆盖报告</title>
<style>
:root{--bg:#f6f4ef;--card:#fffdf8;--ink:#23211d;--muted:#716d64;--line:#d8d0c3;--ok:#5a9e6f;--risk:#c8912b;--fail:#c44;--pua:#8b5cf6;--radius:8px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);max-width:1400px;margin:0 auto;padding:16px;line-height:1.5}
h1{font-size:1.2em}h2{font-size:1em;margin:16px 0 8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-bottom:12px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px}
.stat-card .num{font-size:1.3em;font-weight:700}.stat-card .label{font-size:.72em;color:var(--muted)}
.ok-num{color:var(--ok)}.risk-num{color:var(--risk)}.fail-num{color:var(--fail)}

.drop-zone{border:2px dashed var(--line);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;margin-bottom:12px;transition:.2s}
.drop-zone.drag-over{border-color:var(--accent,#8f4f20);background:#fdf6ee}
.drop-zone p{color:var(--muted);font-size:.85em}
.drop-zone input{display:none}

.font-zone{margin-bottom:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);font-size:.82em}

/* rare chars section */
.rare-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-bottom:16px}
.rare-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.rare-card .char-big{font-size:3em;line-height:1;min-height:1.2em;text-align:center}
.rare-card .char-big.tofu{color:#ddd;font-style:italic;font-size:2em}
.rare-card .info{font-size:.78em;color:var(--muted);margin-top:4px}
.rare-card .info span{font-family:monospace;font-size:.9em}
.rare-card .badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:.7em;font-weight:600}
.badge-extb{background:#fde8f0;color:#a36}
.badge-pua{background:#f3edff;color:#8b5cf6}
.badge-risk{background:#fef3e0;color:var(--risk)}

table{width:100%;border-collapse:collapse;font-size:.82em;background:var(--card);border:1px solid var(--line)}
th{background:#f0ece4;padding:6px 8px;text-align:left;font-weight:600;font-size:.78em;color:var(--muted)}
td{padding:5px 8px;border-top:1px solid #f0ece4}
tr:hover{background:#fdf6ee}
.cp-mono{font-family:"SF Mono","Consolas",monospace;font-size:.78em;color:var(--muted)}

.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.controls input,.controls select,.controls button{padding:5px 8px;border:1px solid var(--line);border-radius:var(--radius);font-size:.82em;background:var(--card)}
.controls input{flex:1;min-width:150px}
.controls button{background:var(--ink);color:var(--card);cursor:pointer;white-space:nowrap}
.controls button:hover{opacity:.8}
.empty{text-align:center;color:#ccc;padding:60px 0}
.tab-bar{display:flex;gap:4px;margin-bottom:8px}
.tab{font-size:.82em;padding:4px 12px;border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;background:var(--card)}
.tab.active{background:var(--ink);color:var(--card);border-color:var(--ink)}
</style>
</head>
<body>

<h1>🔤 字体覆盖报告</h1>
<div class="drop-zone" id="dropZone">
  <p>⬇ 拖入 coverage JSON 报告文件到此处，或点击选择</p>
  <input type="file" id="fileInput">
</div>
<div class="font-zone" id="fontZone" style="display:none">
  拖入字体文件(.ttf/.otf)可对比系统回退 vs 嵌入字体渲染
  <input type="file" id="fontInput" multiple style="display:none">
  <span id="fontInfo" style="margin-left:8px;color:var(--muted)"></span>
</div>
<div id="content"><p class="empty">还没有加载报告 — 拖入 JSON 文件</p></div>

<script>
let report=null,loadedFonts={},allFontsLoaded=false;

const dropZone=document.getElementById('dropZone'),fileInput=document.getElementById('fileInput'),
  fontZone=document.getElementById('fontZone'),fontInput=document.getElementById('fontInput'),
  content=document.getElementById('content'),fontInfo=document.getElementById('fontInfo');

dropZone.addEventListener('click',()=>fileInput.click());
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('drag-over')});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('drag-over');handleFiles(e.dataTransfer.files)});
fileInput.addEventListener('change',()=>handleFiles(fileInput.files));
fontZone.addEventListener('dragover',e=>e.preventDefault());
fontZone.addEventListener('drop',e=>{e.preventDefault();loadFonts(e.dataTransfer.files)});
fontZone.addEventListener('click',()=>fontInput.click());
fontInput.addEventListener('change',()=>loadFonts(fontInput.files));

function handleFiles(files){
  for(const f of files){
    if(f.name.endsWith('.json')||f.type==='application/json'){
      const r=new FileReader();
      r.onload=()=>{try{report=JSON.parse(r.result);fontZone.style.display='block';renderAll()}catch(e){content.innerHTML='<p class=\"empty\" style=\"color:var(--fail)\">JSON parse error: '+e.message+'</p>'}};
      r.readAsText(f);return
    }
    if(/\.(ttf|otf|woff|woff2)$/i.test(f.name))loadFonts([f]);
  }
}
async function loadFonts(files){
  for(const f of files){
    if(!/\.(ttf|otf|woff|woff2)$/i.test(f.name))continue;
    try{
      const buf=await f.arrayBuffer(),name=f.name.replace(/\.[^.]+$/,''),ext=f.name.split('.').pop().toLowerCase(),
        fmt=ext==='otf'?'opentype':ext==='woff'?'woff':'truetype',fn='fp-'+Math.random().toString(36).slice(2,8);
      const face=new FontFace(fn,buf,{style:'normal',weight:'normal'});await face.load();document.fonts.add(face);
      loadedFonts[name.toLowerCase().replace(/[^a-z0-9]/g,'')]={face,fontName:fn,name};
    }catch(e){console.warn('font load fail:',f.name,e)}
  }
  updateFontInfo();if(report)renderAll();
}
function updateFontInfo(){fontInfo.textContent=Object.keys(loadedFonts).length?'已加载 '+Object.keys(loadedFonts).length+' 个字体':'点击拖入字体文件对比字形';allFontsLoaded=Object.keys(loadedFonts).length>0}

function renderAll(){
  if(!report)return;const s=report.summary,chars=report.char_inventory;
  const kp=s.by_profile_risk?.['kindle-pessimistic']||{ok:0,risk:0,fail:0};

  // Group rare chars
  const extb=[],pua=[];
  chars.forEach(ci=>{
    const cp=parseInt(ci.cp.slice(2),16);
    if(cp>=0x20000)extb.push(ci);else if((cp>=0xE000&&cp<=0xF8FF)||cp>=0xF0000)pua.push(ci);
  });

  content.innerHTML=`
    <div class="stats">
      <div class="stat-card"><div class="num">${s.unique_chars}</div><div class="label">去重字符</div></div>
      <div class="stat-card"><div class="num ok-num">${kp.ok}</div><div class="label">✅ Kindle 安全</div></div>
      <div class="stat-card"><div class="num risk-num">${kp.risk}</div><div class="label">⚠️ Kindle 风险</div></div>
      <div class="stat-card"><div class="num fail-num">${kp.fail}</div><div class="label">❌ Kindle 失败</div></div>
      <div class="stat-card"><div class="num">${extb.length}</div><div class="label">Ext B+ 生僻字</div></div>
      <div class="stat-card"><div class="num">${pua.length}</div><div class="label">PUA 私用字</div></div>
    </div>

    ${extb.length||pua.length?`
    <h2>🔴 生僻字 / 特殊字符清单</h2>
    <div class="rare-grid">
      ${extb.map(ci=>rareCard(ci,'extb','Ext B 生僻字 — Kindle 系统字体可能没有')).join('')}
      ${pua.map(ci=>rareCard(ci,'pua','PUA 私用区 — 只有绑定字体有')).join('')}
    </div>
    `:''}

    <div class="tab-bar">
      <span class="tab active" onclick="setTab('all',this)">全部 (${chars.length})</span>
      <span class="tab" onclick="setTab('extb',this)">Ext B+ (${extb.length})</span>
      <span class="tab" onclick="setTab('pua',this)">PUA (${pua.length})</span>
      <span class="tab" onclick="setTab('risk',this)">Kindle 风险 (${kp.risk})</span>
      <span class="tab" onclick="setTab('fail',this)">Kindle 失败 (${kp.fail})</span>
    </div>
    <div class="controls">
      <input id="charFilter" placeholder="搜索字符或码位…" oninput="applyFilter()" style="font-size:1.1em">
      <button onclick="document.getElementById('charFilter').value='';applyFilter()">清除</button>
      <span style="font-size:.8em;color:var(--muted)" id="filterCount"></span>
    </div>
    <table id="charTable"><thead><tr><th>字符</th><th>码位</th><th>次数</th><th>状态</th></tr></thead><tbody></tbody></table>
  `;

  window._chars=chars;window._tab='all';applyFilter();
}

function rareCard(ci,kind,title){
  const cp=parseInt(ci.cp.slice(2),16);
  const cpHex=cp<0x10000?'U+'+cp.toString(16).toUpperCase().padStart(4,'0'):'U+'+cp.toString(16).toUpperCase().padStart(5,'0');
  const badgeClass=kind==='extb'?'badge-extb':'badge-pua';
  // Show fallback if char might not render
  const ctx=ci.occurrences&&ci.occurrences[0]?ci.occurrences[0].context||'':'';
  return '<div class="rare-card" title="'+esc(title)+'">'+
    '<div class="char-big'+(kind==='extb'?' tofu':'')+'">'+esc(ci.char)+'</div>'+
    '<div class="info"><span>'+cpHex+'</span> ×'+ci.count+' <span class="badge '+badgeClass+'">'+kind.toUpperCase()+'</span>'+
    (ctx?'<br>⋯'+esc(ctx)+'⋯':'')+'</div></div>';
}

function setTab(tab,el){
  window._tab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');applyFilter();
}

function applyFilter(){
  const q=(document.getElementById('charFilter')?.value||'').toLowerCase();
  const tab=window._tab||'all';
  const chars=window._chars||[];
  let filtered=chars;
  if(tab==='extb')filtered=chars.filter(ci=>parseInt(ci.cp.slice(2),16)>=0x20000);
  if(tab==='pua')filtered=chars.filter(ci=>{const cp=parseInt(ci.cp.slice(2),16);return(cp>=0xE000&&cp<=0xF8FF)||cp>=0xF0000});
  if(tab==='risk')filtered=chars.filter(ci=>(ci._kindle||'ok')==='fail'&&(ci._pos||'')==='only-non-embedded');
  if(tab==='fail')filtered=chars.filter(ci=>(ci._pos||'')==='none'||(ci._causes||[]).length>0);
  if(q)filtered=filtered.filter(ci=>ci.char.includes(q)||ci.cp.toLowerCase().includes(q)||(ci._causes||[]).some(c=>c.includes(q)));

  const tbody=document.querySelector('#charTable tbody');
  if(!tbody)return;
  tbody.innerHTML=filtered.map(ci=>{
    const kv=ci._kindle||'fail',badge=kv==='ok'?'✅':kv==='fail'?'❌':'⚠️';
    const causes=(ci._causes||[]).map(c=>'<span style="font-size:.7em;padding:1px 4px;border-radius:6px;margin:0 1px;background:'+(c==='true-missing'?'#fde8e8':c==='subset-cut'?'#fde8f0':'#fef3e0')+'">'+c+'</span>').join('');
    return '<tr><td style="font-size:2em;text-align:center;line-height:1">'+esc(ci.char)+'</td>'+
      '<td class="cp-mono">'+ci.cp+'</td><td style="text-align:right">'+ci.count+'</td>'+
      '<td>'+badge+' '+causes+'</td></tr>';
  }).join('');
  document.getElementById('filterCount').textContent='显示 '+filtered.length+' / '+chars.length;
  if(q&&filtered.length===0){
    tbody.innerHTML='<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:20px">未找到匹配字符</td></tr>';
  }
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
</script>
</body>
</html>
