<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字体覆盖报告</title>
<style>
:root{--bg:#f6f4ef;--card:#fffdf8;--ink:#23211d;--muted:#716d64;--line:#d8d0c3;--ok:#5a9e6f;--risk:#c8912b;--fail:#c44;--pua:#8b5cf6}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);max-width:1200px;margin:0 auto;padding:16px;line-height:1.5}
h1{font-size:1.2em}h2{font-size:1em;margin:12px 0 6px}
.drop-zone{border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center;cursor:pointer;margin-bottom:10px;transition:.2s}
.drop-zone.drag-over{border-color:#8f4f20;background:#fdf6ee}
.drop-zone p{color:var(--muted);font-size:.85em}
.drop-zone input,.drop-zone input[type=file]{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px;margin-bottom:10px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat-card .num{font-size:1.2em;font-weight:700}.stat-card .label{font-size:.7em;color:var(--muted)}
.ok-num{color:var(--ok)}.risk-num{color:var(--risk)}.fail-num{color:var(--fail)}

/* Problem list */
.problem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px;margin-bottom:12px}
.problem-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.problem-card .char-big{font-size:2.8em;line-height:1;text-align:center;min-height:1.1em}
.problem-card .char-big.tofu{color:#ddd}
.problem-card .meta{font-size:.75em;color:var(--muted);margin-top:4px}
.problem-card .fix{font-size:.75em;background:#e8f5e9;padding:3px 6px;border-radius:4px;margin-top:4px;line-height:1.3}
.badge{display:inline-block;padding:1px 5px;border-radius:6px;font-size:.68em;font-weight:600;margin:0 1px}
.b-extb{background:#fde8f0;color:#a36}.b-pua{background:#f3edff;color:#8b5cf6}.b-fail{background:#fde8e8;color:var(--fail)}.b-risk{background:#fef3e0;color:var(--risk)}

.tab-bar{display:flex;gap:4px;margin:10px 0 6px;flex-wrap:wrap}
.tab{font-size:.78em;padding:4px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--card)}
.tab.active{background:var(--ink);color:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.8em;background:var(--card);border:1px solid var(--line)}
th{background:#f0ece4;padding:5px 7px;text-align:left;font-size:.75em;color:var(--muted)}
td{padding:4px 7px;border-top:1px solid #f0ece4}.cp-mono{font-family:monospace;font-size:.8em;color:var(--muted)}
.font-zone{margin-bottom:8px;font-size:.78em;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.empty{text-align:center;color:#ccc;padding:60px 0}
</style>
</head>
<body>

<h1>🔤 字体覆盖报告</h1>
<div class="drop-zone" id="dropZone">
  <p>⬇ 拖入 <b>coverage JSON</b> 或 <b>EPUB 文件</b>（加载字体）+ 也可拖入 .ttf/.otf</p>
  <input type="file" id="fileInput" multiple>
</div>
<div class="font-zone" id="fontZone" style="display:none">字体：点击或拖入 EPUB/ttf/otf 加载内嵌字体用于字形对比</div>
<div id="content"><p class="empty">拖入 coverage JSON 报告文件开始</p></div>

<script>
let report=null,loadedFonts={};

const dz=document.getElementById('dropZone'),fi=document.getElementById('fileInput'),
  fz=document.getElementById('fontZone'),ct=document.getElementById('content');

dz.addEventListener('click',()=>fi.click());
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over')});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');handleFiles(e.dataTransfer.files)});
fi.addEventListener('change',()=>handleFiles(fi.files));

async function handleFiles(files){
  for(const f of files){
    if(f.name.endsWith('.json')||f.type==='application/json'){
      const r=new FileReader();r.onload=()=>{try{report=JSON.parse(r.result);renderAll()}catch(e){ct.innerHTML='<p class=empty style=color:var(--fail)>JSON parse error</p>'}};r.readAsText(f);return
    }
    const ext=f.name.split('.').pop().toLowerCase();
    if(f.name.endsWith('.epub')){await loadFromEpub(f);renderAll();continue}
    if(/^(ttf|otf|woff|woff2)$/.test(ext))await loadFont(f);
  }
  if(!report)return;
  updateFontInfo();renderAll();
}
async function loadFont(f){
  try{
    const buf=await f.arrayBuffer(),name=f.name.replace(/\.[^.]+$/,''),ext=f.name.split('.').pop().toLowerCase(),
      fmt=ext==='otf'?'opentype':ext==='woff'?'woff':'truetype',fn='fp-'+Math.random().toString(36).slice(2,8);
    const face=new FontFace(fn,buf,{style:'normal',weight:'normal'});await face.load();document.fonts.add(face);
    loadedFonts[name.toLowerCase().replace(/[^a-z0-9]/g,'')]={face,fontName:fn,name};
  }catch(e){console.warn('font fail:',f.name)}
}

// Minimal ZIP reader for EPUB font extraction
async function* zipEntries(buf){
  const dv=new DataView(buf);let eocd=buf.byteLength-22;
  while(eocd>0){if(dv.getUint32(eocd,true)===0x06054b50)break;eocd--}
  if(eocd<=0)return;
  const cdOff=dv.getUint32(eocd+16,true),total=dv.getUint16(eocd+10,true);
  let pos=cdOff;
  for(let i=0;i<total;i++){
    if(dv.getUint32(pos,true)!==0x02014b50)break;
    const method=dv.getUint16(pos+10,true),cSize=dv.getUint32(pos+20,true),
      uSize=dv.getUint32(pos+24,true),nLen=dv.getUint16(pos+28,true),
      exLen=dv.getUint16(pos+30,true),cmLen=dv.getUint16(pos+32,true),
      lhOff=dv.getUint32(pos+42,true);
    const name=new TextDecoder().decode(new Uint8Array(buf,pos+46,nLen));
    pos+=46+nLen+exLen+cmLen;
    // local header: skip signature(4)+version(2)+flags(2)+method(2)+times(8)+crc(4)
    const dataOff=lhOff+30+dv.getUint16(lhOff+26,true)+dv.getUint16(lhOff+28,true);
    if(/\.(ttf|otf|woff|woff2)$/i.test(name)&&method===0){
      yield{name,data:new Uint8Array(buf,dataOff,cSize)};
    }else if(/\.(ttf|otf|woff|woff2)$/i.test(name)&&method===8){
      const raw=new Uint8Array(buf,dataOff,cSize);
      try{
        const ds=new DecompressionStream('deflate'),w=ds.writable.getWriter(),r=ds.readable.getReader();
        w.write(raw);w.close();let chunks=[],total=0;
        while(1){const{value,done}=await r.read();if(done)break;chunks.push(value);total+=value.length}
        const out=new Uint8Array(total);let p=0;for(const c of chunks){out.set(c,p);p+=c.length}
        yield{name,data:out};
      }catch(e){console.warn('deflate fail:',name)}
    }
  }
}
async function loadFromEpub(f){
  const buf=await f.arrayBuffer();let count=0;
  for await(const e of zipEntries(buf)){
    const blob=new Blob([e.data]),name=e.name.split('/').pop();
    await loadFont({name,arrayBuffer:()=>blob.arrayBuffer()});count++;
  }
  fz.innerHTML='字体：从 EPUB 加载了 <b>'+count+'</b> 个字体（点击拖入可追加）';
  fz.style.display='block';
}
function updateFontInfo(){
  const n=Object.keys(loadedFonts).length;
  if(!n)return;
  fz.innerHTML='字体：已加载 <b>'+n+'</b> 个 <span style="font-size:.75em">('+[...new Set(Object.values(loadedFonts).map(f=>f.name))].join(', ')+')</span>';
  fz.style.display='block';
}
fz.addEventListener('dragover',e=>e.preventDefault());
fz.addEventListener('drop',async e=>{e.preventDefault();for(const f of e.dataTransfer.files)await loadFont(f);updateFontInfo();renderAll()});
fz.addEventListener('click',()=>{const inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.accept='.ttf,.otf,.woff,.woff2,.epub';inp.onchange=async()=>{for(const f of inp.files)await loadFont(f);updateFontInfo();renderAll()};inp.click()});

function findFont(name){
  if(!name)return null;
  const k=name.toLowerCase().replace(/[^a-z0-9]/g,'');
  return loadedFonts[k]||null;
}

function renderAll(){
  if(!report)return;
  const s=report.summary,chars=report.char_inventory,fonts=report.fonts?.embedded||[];
  const kp=s.by_profile_risk?.['kindle-pessimistic']||{ok:0,risk:0,fail:0};
  const ib=s.by_profile_risk?.['ideal-browser']||{ok:0,risk:0,fail:0};

  // Group problem chars
  const extb=[],pua=[],fails=[],risks=[];
  const fixable=[];
  chars.forEach(ci=>{
    const cp=parseInt(ci.cp.slice(2),16);
    if(cp>=0x20000)extb.push(ci);
    else if((cp>=0xE000&&cp<=0xF8FF)||cp>=0xF0000)pua.push(ci);
    const kv=ci._kindle||'fail';
    if(kv!=='ok')risks.push(ci);
    // Check if fixable: has an embedded font that could cover it
    const cby=ci._covered_by;
    if(cby&&kv!=='ok')fixable.push(ci);
  });

  const causeCounts={};
  chars.forEach(ci=>{(ci._causes||[]).forEach(c=>{causeCounts[c]=(causeCounts[c]||0)+1})});

  ct.innerHTML=`
    <div class="stats">
      <div class="stat-card"><div class="num">${s.unique_chars}</div><div class="label">去重字符</div></div>
      <div class="stat-card"><div class="num ok-num">${kp.ok}</div><div class="label">✅ Kindle 安全</div></div>
      <div class="stat-card"><div class="num risk-num">${kp.risk}</div><div class="label">⚠️ Kindle 风险</div></div>
      <div class="stat-card"><div class="num fail-num">${kp.fail}</div><div class="label">❌ Kindle 失败</div></div>
      <div class="stat-card"><div class="num">${extb.length}</div><div class="label">Ext B+ 生僻字</div></div>
      <div class="stat-card"><div class="num">${pua.length}</div><div class="label">PUA 私用字</div></div>
    </div>
    ${Object.keys(causeCounts).length?`<div style="font-size:.78em;color:var(--muted);margin-bottom:8px">原因：
      ${Object.entries(causeCounts).map(([c,n])=>'<span style="margin:0 6px">'+causeLabel(c)+': '+n+'</span>').join('')}
    </div>`:''}

    ${extb.length||pua.length?`
    <h2>🔴 超出范围字符 (${extb.length+pua.length})</h2>
    <div class="problem-grid">
      ${extb.map(ci=>problemCard(ci,'extb')).join('')}
      ${pua.map(ci=>problemCard(ci,'pua')).join('')}
    </div>
    `:''}

    ${fixable.length?`
    <h2>💡 可修复字符 (${fixable.length}) — 调整字体链即可</h2>
    <p style="font-size:.78em;color:var(--muted);margin-bottom:6px">这些字在嵌入字体中存在，但因位置靠后或子集裁切导致 Kindle 不可达。把对应字体提到链首即可修复。</p>
    <div class="problem-grid">
      ${fixable.map(ci=>problemCard(ci,'fixable')).join('')}
    </div>
    `:''}

    <div class="tab-bar">
      <span class="tab active" onclick="setTab('all',this)">全部 (${chars.length})</span>
      <span class="tab" onclick="setTab('extb',this)">Ext B+ (${extb.length})</span>
      <span class="tab" onclick="setTab('pua',this)">PUA (${pua.length})</span>
      <span class="tab" onclick="setTab('risk',this)">⚠️ 风险 (${kp.risk})</span>
      <span class="tab" onclick="setTab('fail',this)">❌ 失败 (${kp.fail})</span>
    </div>
    <div style="margin-bottom:8px">
      <input id="charFilter" placeholder="搜索字符" style="padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:.85em;width:200px" oninput="applyFilter()">
      <span style="font-size:.78em;color:var(--muted);margin-left:8px" id="filterCount"></span>
    </div>
    <table id="charTable"><thead><tr><th>字符</th><th>码位</th><th>次数</th><th>状态</th><th>内嵌对比</th><th>修复建议</th></tr></thead><tbody></tbody></table>
  `;
  window._chars=chars;window._tab='all';applyFilter();
}

function problemCard(ci,kind){
  const cp=parseInt(ci.cp.slice(2),16),kchar=kind==='extb'?'tofu':'';
  const cby=ci._covered_by,ctx=(ci.occurrences&&ci.occurrences[0])?ci.occurrences[0].context||'':'';
  let fix='';
  if(cby&&kind==='fixable'){
    fix='<div class="fix">✅ 修复：把 <b>'+esc(cby)+'</b> 字体放到 font-family 链首位即可解决</div>';
  }else if(kind==='extb'){
    fix='<div class="fix" style="background:#fef3e0">⚠️ 该字在 Ext B 区，Kindle 系统字体可能缺。需要嵌入覆盖此字的字体到链首（见 Kindle 字体深度参考）</div>';
  }
  // Show embedded font render if available
  let glyph='';
  if(cby&&Object.keys(loadedFonts).length){
    const lf=findFont(cby);
    if(lf)glyph=' <span style="font-size:2em;line-height:1;font-family:\''+lf.fontName+'\'">'+esc(ci.char)+'</span>';
  }
  return '<div class="problem-card">'+
    '<div class="char-big '+kchar+'">'+esc(ci.char)+glyph+'</div>'+
    '<div class="meta">'+ci.cp+' ×'+ci.count+
    (cby?' <span class="badge b-extb">字体：'+esc(cby)+'</span>':'')+
    ((ci._causes||[]).map(c=>' <span class="badge '+(c==='true-missing'?'b-fail':'b-risk')+'">'+causeLabel(c)+'</span>').join(''))+
    '</div>'+
    (ctx?'<div class="meta">⋯'+esc(ctx)+'⋯</div>':'')+
    fix+'</div>';
}

function setTab(t,e){window._tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e.classList.add('active');applyFilter()}

function applyFilter(){
  const q=(document.getElementById('charFilter')?.value||'').toLowerCase();
  const tab=window._tab||'all';
  let chars=window._chars||[];
  if(tab==='extb')chars=chars.filter(ci=>parseInt(ci.cp.slice(2),16)>=0x20000);
  else if(tab==='pua')chars=chars.filter(ci=>{const cp=parseInt(ci.cp.slice(2),16);return(cp>=0xE000&&cp<=0xF8FF)||cp>=0xF0000});
  else if(tab==='risk')chars=chars.filter(ci=>(ci._kindle||'ok')!=='ok');
  else if(tab==='fail')chars=chars.filter(ci=>(ci._pos||'')==='none'||(ci._causes||[]).length>0);
  if(q)chars=chars.filter(ci=>ci.char.includes(q)||ci.cp.toLowerCase().includes(q)||(ci._causes||[]).some(c=>c.includes(q)));

  const tbody=document.querySelector('#charTable tbody');
  if(!tbody)return;
  tbody.innerHTML=chars.map(ci=>{
    const kv=ci._kindle||'fail',badge=kv==='ok'?'<span class=badge style=background:#e8f5e9;color:var(--ok)>✅ 安全</span>'
      :kv==='fail'?'<span class=badge style=background:#fde8e8;color:var(--fail)>❌ 风险</span>'
      :'<span class=badge style=background:#fef3e0;color:var(--risk)>⚠️ 风险</span>';
    const causes=(ci._causes||[]).map(c=>'<span style="font-size:.7em;padding:1px 4px;border-radius:4px;margin:0 1px;background:'+(c==='true-missing'?'#fde8e8':c==='subset-cut'?'#fde8f0':'#fef3e0')+'">'+causeLabel(c)+'</span>').join('');
    const cby=ci._covered_by;
    let glyph='—',fix='—';
    if(cby&&Object.keys(loadedFonts).length){
      const lf=findFont(cby);
      glyph=lf?'<span style="font-size:1.8em;line-height:1;font-family:\''+lf.fontName+'\'">'+esc(ci.char)+'</span>':'<span style="color:#ccc">未加载</span>';
      fix='<span style="font-size:.72em">把 <b>'+esc(cby)+'</b> 放链首</span>';
    }else if(cby){
      fix='<span style="font-size:.72em">把 <b>'+esc(cby)+'</b> 放链首（未加载字体）</span>';
      glyph='<span style="color:#ccc">拖入 EPUB</span>';
    }else if(kv!=='ok'){
      fix='<span style="font-size:.72em;color:var(--muted)">需嵌入覆盖此字的字体</span>';
      glyph='<span style="color:#ccc">—</span>';
    }
    return '<tr><td style="font-size:2em;text-align:center;line-height:1">'+esc(ci.char)+'</td>'+
      '<td class=cp-mono>'+ci.cp+'</td><td style=text-align:right>'+ci.count+'</td>'+
      '<td>'+badge+' '+causes+'</td>'+
      '<td style=text-align:center>'+glyph+'</td><td>'+fix+'</td></tr>';
  }).join('');
  document.getElementById('filterCount').textContent='显示 '+chars.length+' / '+(window._chars||[]).length;
  if(q&&!chars.length)tbody.innerHTML='<tr><td colspan=6 style=text-align:center;padding:20px;color:var(--muted)>未找到</td></tr>';
}
function causeLabel(c){return{['true-missing']:'真缺字',['fallback-not-reached']:'回退未生效',['subset-cut']:'子集裁切',['unknown']:'未知'}[c]||c}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
</script>
</body>
</html>
