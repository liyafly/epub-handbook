[project]
name = "epub-font-coverage-detector"
version = "0.1.0"
description = "EPUB font coverage detector — classify every rendered character by font coverage status and predict reader behavior"
requires-python = ">=3.14"
dependencies = [
    "fonttools>=4.50",
    "tinycss2>=1.3",
    "lxml>=5.0",
]

[project.scripts]
epub-font-coverage = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
